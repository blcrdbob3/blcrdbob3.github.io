<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Preserve the full URL path
      const path = window.location.pathname + window.location.search + window.location.hash;

      // Only redirect if the requested file doesn't exist
      // Serve index.html (React app) so React Router handles the path
      window.location.href = '/?redirect=' + encodeURIComponent(path);
    </script>
  </head>
  <body>
    <p>Loading...</p>
  </body>
</html>
